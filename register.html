<body class="auth-page" data-page="register">
    <div class="auth-layout register-layout">
        <section class="auth-visual register-visual">
            <div class="auth-overlay"></div>
            <div class="auth-copy">
                <span class="eyebrow">Nexora Mobility</span>
                <h1>Buat akun dan mulai booking kendaraan dengan cepat.</h1>
                <p>Registrasi sederhana, tampilan modern, dan sistem rental yang mudah dipahami untuk mobil maupun motor.</p>
            </div>
        </section>
        <section class="auth-panel">
            <div class="auth-topbar">
                <a href="./beranda.html" class="brand"><span class="brand-logo"><img src="assets/logo-nexora.svg" alt="Logo Nexora Mobility"></span><span class="brand-text">Nexora <span>Mobility</span></span></a>
                <button type="button" class="theme-toggle" id="themeToggle" aria-label="Ganti tema"></button>
            </div>
            <div class="auth-card wide">
                <h2>Buat Akun</h2>
                <p>Lengkapi data berikut untuk membuat akun pelanggan.</p>
                <div id="registerAlert" class="alert"></div>
                <form id="registerForm">
                    <div class="two-col">
                        <div class="input-group">
                            <label for="registerName">Nama Lengkap</label>
                            <input id="registerName" type="text" class="input-control" placeholder="Nama lengkap">
                        </div>
                        <div class="input-group">
                            <label for="registerPhone">Nomor HP</label>
                            <input id="registerPhone" type="text" class="input-control" placeholder="08xxxxxxxxxx">
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="registerEmail">Alamat Email</label>
                        <input id="registerEmail" type="email" class="input-control" placeholder="nama@email.com">
                    </div>
                    <div class="two-col">
                        <div class="input-group">
                            <label for="registerPassword">Kata Sandi</label>
                            <input id="registerPassword" type="password" class="input-control" placeholder="Minimal 6 karakter">
                        </div>
                        <div class="input-group">
                            <label for="registerConfirm">Konfirmasi Kata Sandi</label>
                            <input id="registerConfirm" type="password" class="input-control" placeholder="Ulangi kata sandi">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Daftar</button>
                </form>
                <p class="auth-switch">Sudah punya akun? <a href="./login.html">Masuk</a></p>
            </div>
        </section>
    </div>
